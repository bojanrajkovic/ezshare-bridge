[platformio]
default_envs = nonpro

; FYSETC SD-WIFI (non-Pro): ESP-M2 module (ESP8285, 1 MB flash) with a microSD socket on SPI.
[env:nonpro]
platform = espressif8266@4.2.1
board = esp8285
framework = arduino
board_build.flash_mode = dout
; No filesystem partition: data lives on the microSD, so the whole 1 MB goes to two OTA slots.
board_build.ldscript = eagle.flash.1m.ld
; Keep the default lwIP build (536-byte TCP segments). The 1460-byte variant
; (PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH) served a 1.1 MB file at the same 45-52 KB/s at
; -62 dBm, and at -77 dBm it was no help either, for about 1 KB less free heap.
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11
    -std=gnu++14
extra_scripts = pre:scripts/version.py
monitor_speed = 115200
upload_speed = 460800

; Over-the-air updates after the first USB flash: pio run -e nonpro-ota -t upload --upload-port <ip>
[env:nonpro-ota]
extends = env:nonpro
upload_protocol = espota
upload_flags =
    --auth=${sysenv.EZB_OTA_PASSWORD}

; Host-side unit tests for lib/ezshare (no Arduino code).
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
