# Your 1Password account, vault and item IDs go in mise.local.toml (gitignored). See README.md.

[tools]
"aqua:1password/cli" = "v2.42.0"  # the real op: `mise run secrets` signs in with your password
uv = "0.11.7"

[env]
_.file = { path = "mise.local.toml", redact = true, tools = false }

[tasks.test]
description = "Run the listing parser and download decision tests on this machine"
run = "uvx --from platformio==6.2.0 pio test -e native"

[tasks.build]
description = "Build the firmware"
run = "uvx --from platformio==6.2.0 pio run -e nonpro"

[tasks.flash]
description = "First install over USB (board switch on USB2UART)"
run = "uvx --from platformio==6.2.0 pio run -e nonpro -t upload"

[tasks.ota]
description = "Install over Wi-Fi: mise run ota <ip or hostname.local>"
usage = 'arg "<host>"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
EZB_OTA_PASSWORD="$(sed -n 's/^#define OTA_PASSWORD "\(.*\)"$/\1/p' include/secrets.h)" \
  uvx --from platformio==6.2.0 pio run -e nonpro-ota -t upload --upload-port "${usage_host}"
'''

[tasks.monitor]
description = "Serial console over USB"
run = "uvx --from platformio==6.2.0 pio device monitor -e nonpro"

[tasks.secrets]
description = "Write include/secrets.h from 1Password"
run = "scripts/secrets.sh"
